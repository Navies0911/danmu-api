name: Daily Upstream Sync

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync upstream source
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream \
            https://github.com/huangxd-/danmu_api.git
          git fetch upstream main

          # 将代码树更新为上游最新版本，但不引入上游提交历史
          git read-tree --reset -u upstream/main

          # 删除上游工作流，避免 workflows 权限错误
          git rm -rf --ignore-unmatch .github/workflows

          # 恢复并仅保留本仓库自己的同步工作流
          git checkout origin/main -- \
            .github/workflows/sync_upstream.yml

          git add -A

          if git diff --cached --quiet; then
            echo "Already up to date."
            exit 0
          fi

          git commit -m "chore: sync source from upstream"
          git push origin HEAD:main
